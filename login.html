<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Login to SimpleSite with AWS Cognito and Google.">
    <title>Login | Simple AWS Website</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body class="auth-body">
    <header class="site-header">
      <a class="brand" href="index.html" aria-label="Simple AWS Website home">
        <span class="brand-mark">S</span>
        <span>SimpleSite</span>
      </a>

      <nav class="nav" aria-label="Main navigation">
        <a href="index.html#features">Features</a>
        <a href="index.html#pricing">Pricing</a>
        <a href="index.html#contact">Contact</a>
      </nav>
    </header>

    <main class="auth-main">
      <section class="auth-card" aria-labelledby="login-title">
        <div>
          <p class="eyebrow">User login</p>
          <h1 id="login-title">Your personal account.</h1>
          <p class="auth-copy">
            Sign in to open your personal record page and upload pictures securely to AWS S3.
          </p>
        </div>

        <form class="auth-actions" id="auth-form">
          <label class="field-label">
            Email
            <input class="text-field" id="email" type="email" autocomplete="email" required>
          </label>
          <label class="field-label">
            Password
            <input class="text-field" id="password" type="password" autocomplete="current-password">
          </label>
          <label class="field-label hidden" id="code-field">
            Code
            <input class="text-field" id="code" type="text" inputmode="numeric" autocomplete="one-time-code">
          </label>

          <button class="button primary full-width" type="submit" id="submit-button">
            Login
          </button>
          <div class="auth-links">
            <button class="link-button" type="button" data-mode="signup">Create account</button>
            <button class="link-button" type="button" data-mode="confirm">Confirm account</button>
            <button class="link-button" type="button" data-mode="forgot">Forgot password?</button>
            <button class="link-button hidden" type="button" data-mode="login" id="back-login">Back to login</button>
          </div>
        </form>

        <p class="auth-note" id="auth-message" role="status">
          Login opens your dashboard. New users can create an account and confirm with the email code.
        </p>
      </section>
    </main>

    <script type="module" src="auth.js"></script>
  </body>
</html>
